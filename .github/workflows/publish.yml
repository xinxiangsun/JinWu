name: Publish jinwu family + jinwurs

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'         # e.g. v0.2.0 — lockstep release of all packages
  workflow_dispatch:  # Select the release tag as ref, never a branch.

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a release tag matching every package version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          match = re.fullmatch(r"refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)", ref)
          if match is None:
              raise SystemExit("Publish requires a release tag; dispatch with --ref vX.Y.Z.")
          expected = match.group(1)
          packages = ("jinwu", "jinwu-ep", "jinwu-swift", "jinwu-fermi", "jinwu-gw", "jinwu-gecam", "jinwurs")
          for package in packages:
              path = Path("packages") / package / "pyproject.toml"
              actual = tomllib.loads(path.read_text())["project"]["version"]
              if actual != expected:
                  raise SystemExit(f"{path}: {actual} does not match tag version {expected}")
          path = Path("packages/jinwurs/Cargo.toml")
          actual = tomllib.loads(path.read_text())["package"]["version"]
          if actual != expected:
              raise SystemExit(f"{path}: {actual} does not match tag version {expected}")
          print(f"All seven packages match v{expected}")
          PY

  # ── Python (jinwu, jinwu-ep, jinwu-swift, jinwu-fermi, jinwu-gw, jinwu-gecam) ──
  build-python:
    needs: [check-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public checkout excludes private research files
        run: |
          private_paths=$(git ls-files -- ':(glob)**/examples/**' ':(glob)**/example/**' '*.ipynb' 'artifacts/**' 'reviews/**' 'scripts/**' 'conda-pypi-output/**' 'implementation_plan.md' 'ARCHITECTURE_ROADMAP.md' 'docs/locale/**' '*.mo' ':(glob)**/VALIDATION.md')
          if [ -n "$private_paths" ]; then
            echo "Private research or development files are tracked; remove them from the public checkout."
            exit 1
          fi
      - name: Build all Python distributions
        run: |
          pip install build
          for pkg in packages/jinwu packages/jinwu-ep packages/jinwu-swift packages/jinwu-fermi packages/jinwu-gw packages/jinwu-gecam; do
            echo "::group::build $pkg"
            python -m build "$pkg" --outdir dist/
            echo "::endgroup::"
          done
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Rust (jinwurs, abi3 → 3.11+) ──────────────────
  build-rust:
    needs: [check-release]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
        # ubuntu-latest  → manylinux_2_17（兼容 CentOS 7+, Debian 10+, Ubuntu 20.04+）
        # macos-latest    → Apple Silicon arm64（自动跟踪最新版本）
        # abi3-py311: 单 wheel 覆盖 CPython 3.11 / 3.12 / 3.13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: latest
          command: build
          args: --release --out dist --manifest-path packages/jinwurs/Cargo.toml
          manylinux: auto
      - name: Build Rust source distribution once
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: latest
          command: sdist
          args: --out dist --manifest-path packages/jinwurs/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: rust-wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  # ── Wheel install / discovery / example gate (AUD-04) ──
  wheel-gate:
    needs: [build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Install wheels into a clean venv
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install -q dist/*.whl pytest
      - name: Smoke — imports, entry-point discovery, wheel-layout code deps
        run: |
          wheel-env/bin/python - <<'PY'
          import inspect
          from importlib.metadata import entry_points, version
          from pathlib import Path

          import jinwu.core
          import jinwu.ep.wxt.pipeline
          import jinwu.swift.bat.survey
          import jinwu.swift.grb.pipeline
          import jinwu.fermi
          import jinwu.gw
          import jinwu.gecam

          names = sorted(e.name for e in entry_points(group="jinwu.instruments"))
          assert {"ep", "swift", "fermi", "gw", "gecam"} <= set(names), f"missing entry points: {names}"

          from jinwu.core import timescale
          p = Path(inspect.getsourcefile(timescale))
          assert p.is_file(), f"wheel layout lost module file: {p}"

          print("wheel smoke ok:", version("jinwu"), names)
          PY
      - name: Run offline gate tests against installed wheels
        run: |
          wheel-env/bin/python -m pytest \
            test/test_quickstart_examples.py test/test_stage_code_deps.py test/test_gr.py packages/jinwu-ep/tests packages/jinwu-gecam/tests \
            -p no:cacheprovider -m 'not network and not heasoft and not real_data' -ra

  # ── Publish + Release ──────────────────────────────
  publish:
    needs: [build-python, build-rust, wheel-gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts/

      - name: Collect all distributions
        run: |
          mkdir -p dist
          # abi3 wheels built by different Python versions share the same
          # filename; copy one-by-one with -f so duplicates overwrite instead
          # of making cp fail with "will not overwrite just-created"
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -type f -print0 \
            | xargs -0 -I{} cp -f "{}" dist/
          echo "=== All packages ==="
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
