{% set name = "jinwu" %}
{% set version = "0.2.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/jinwu-{{ version }}.tar.gz
  sha256: 5eeaa86b8b8c632dbba587dd66c79a4ff3402b4b2f2cbe1842d0752c58388fdb

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - astropy >=7.1.0
    - matplotlib >=3.7
    - pillow
  # --- 仪器包（独立发行，均依赖 jinwu；发布后各自建 conda 配方） ---
  # jinwu-ep: Einstein Probe (WXT)
  # jinwu-swift: swiftbat + batanalysis（PyPI-only）
  # jinwu-fermi: astro-gdt / astro-gdt-fermi
  # --- 可选依赖（pip extras；多数不在 conda-forge，代码已按需降级） ---
  # pandas / astroquery / plotly / ipyaladin / regions / requests ([crossmatch])
  # pandas / seaborn / scikit-learn ([cluster])
  # heasoft / pyxspec: 谱拟合所需，conda install -c conda-forge heasoft
  # 如果 jinwurs 也发布了 conda 包，取消下面注释
  # run_constrained:
  #   - jinwurs >=0.2.0

test:
  imports:
    - jinwu
    - jinwu.core
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/xinxiangsun/jinwu
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Joint inference and physical modeling toolkit for high-energy transient light-curve and spectral analysis.
  description: |
    JinWu (金乌) is a toolkit for joint inference and physical modeling of
    high-energy transient light-curves and spectra, supporting unified
    analysis and flexible extension. Instrument support (EP, Swift, Fermi)
    is provided by the separate jinwu-ep / jinwu-swift / jinwu-fermi packages.
  doc_url: https://jinwu.readthedocs.io
  dev_url: https://github.com/xinxiangsun/jinwu

extra:
  recipe-maintainers:
    - xinxiangsun
