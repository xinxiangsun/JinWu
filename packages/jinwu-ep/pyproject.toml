[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jinwu-ep"
version = "0.2.0"
description = "Einstein Probe (WXT) instrument support for the jinwu analysis toolkit."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Xinxiang Sun", email = "sunxx@nao.cas.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "jinwu>=0.2,<0.3",
    "regions>=0.5",
]
keywords = ["astrophysics", "transient", "einstein-probe", "wxt", "jinwu"]

classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Development Status :: 3 - Alpha"
]

[project.urls]
Homepage = "https://github.com/xinxiangsun/jinwu"
Repository = "https://github.com/xinxiangsun/jinwu"
Documentation = "https://jinwu.readthedocs.io"

[project.entry-points."jinwu.instruments"]
ep = "jinwu.ep"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jinwu.ep*"]
