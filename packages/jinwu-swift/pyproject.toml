[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jinwu-swift"
version = "0.2.0"
description = "Swift/BAT instrument support for the jinwu analysis toolkit."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Xinxiang Sun", email = "sunxx@nao.cas.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "jinwu>=0.2,<0.3",
    "swiftbat",
]
keywords = ["astrophysics", "transient", "swift", "bat", "jinwu"]

classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Development Status :: 3 - Alpha"
]

[project.optional-dependencies]
# gdt-swift 提供 SAO/poshist 指向文件读取（bat_observation 可选导入）
gdt = ["astro-gdt-swift>=2.2"]
# swifttools 提供 UKSSDC 目录查询与 Burst Analyser 下载（grb.pipeline 下载档可选导入）
ukssdc = ["swifttools>=3.0"]
# BatAnalysis and HEASARC query support for the single-target survey pipeline.
survey = ["batanalysis>=2.1", "astroquery>=0.4"]

[project.urls]
Homepage = "https://github.com/xinxiangsun/jinwu"
Repository = "https://github.com/xinxiangsun/jinwu"
Documentation = "https://jinwu.readthedocs.io"

[project.entry-points."jinwu.instruments"]
swift = "jinwu.swift"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jinwu.swift*"]
